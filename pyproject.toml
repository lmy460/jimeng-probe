[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jimeng-probe"
version = "0.1.0"
description = "Probe and reuse the Jimeng (即梦) web image-generation API with budget-aware credit accounting"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["jimeng", "dreamina", "image-generation", "reverse-engineering", "probe"]

[project.scripts]
jimeng = "jimeng.cli:main"

[tool.setuptools]
packages = ["jimeng"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
